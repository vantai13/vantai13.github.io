name: Recover stalled Pages deployment

on:
  workflow_dispatch:
    inputs:
      deployment_ids:
        description: Space-separated commit SHAs or IDs of stalled Pages deployments to cancel
        required: true
        default: 6bf61d6b002b972109e3fa4293c8f1fa17ec5381 65a3c4d9b652d74c0ea241ca390aa8594955e2e7
        type: string
  push:
    branches: [main]
    paths: [.github/workflows/recover-pages.yml]

permissions:
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the specified stalled Pages deployments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          STALE_DEPLOYMENTS: ${{ inputs.deployment_ids || '6bf61d6b002b972109e3fa4293c8f1fa17ec5381 65a3c4d9b652d74c0ea241ca390aa8594955e2e7' }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          for deployment in os.environ['STALE_DEPLOYMENTS'].split():
              endpoint = 'https://api.github.com/repos/' + os.environ['TARGET_REPO'] + '/pages/deployments/' + deployment + '/cancel'
              request = Request(endpoint, method='POST', data=b'', headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'portfolio-pages-recovery',
              })
              try:
                  with urlopen(request, timeout=30) as response:
                      print('Cancel request HTTP', response.status, 'for', deployment)
              except HTTPError as error:
                  print('Cancel request HTTP', error.code, 'for', deployment)
                  print(error.read().decode())
                  if error.code not in (404, 409):
                      raise SystemExit(1)
          PY
